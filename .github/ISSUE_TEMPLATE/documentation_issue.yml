name: Documentation issue
description: Report unclear, stale, or missing documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: page
    attributes:
      label: Page or section
      description: Link the file, heading, release note, or public page.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is confusing or stale?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or source of truth
      description: Link the checked-in evidence, command output, or code path that should control the wording.
  - type: checkboxes
    id: boundary
    attributes:
      label: Claim boundary
      options:
        - label: This docs request does not ask for unsupported compatibility claims.
          required: true
